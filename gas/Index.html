<html data-theme="light" style="color-scheme:light">
<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>firewatch</title>
<style>:root{--bg:#0d0d0f;--panel:#131316;--line:#26262b;--txt:#c8c8cd;--dim:#6a6a72;--red:#ff4141;--orange:#ff7a3c;--yellow:#ffd23f;--green:#2ee06e;--cyan:#2fd9c8;--btn-bg:#17171c;--btn-border:#3a3a42;--btn-active:#24242c;--input-bg:#1a1a1f;--input-border:#3a3a42;--list-bg:transparent;--list-border:#191920;--list-fire-bg:rgba(255,65,65,.07);--status-bg:linear-gradient(90deg,rgba(255,122,60,.06),transparent);--body-bg:radial-gradient(1200px 600px at 50% -10%,#1c1510,#0d0d0f 70%);--radar-bg:#0b0d0e;--radar-rim:rgba(46,224,110,0.35);--radar-tick:rgba(46,224,110,0.4);--thead-bg:rgba(13,13,15,.94);}[data-theme="light"]{--bg:#ffffff;--panel:#ffffff;--line:#d4d4d8;--txt:#111118;--dim:#787880;--red:#cc1a1a;--orange:#d4551a;--yellow:#8a6d00;--green:#1a7040;--cyan:#1a6058;--btn-bg:#e8e8ec;--btn-border:#c4c4cc;--btn-active:#dcdce0;--input-bg:#ffffff;--input-border:#d4d4d8;--list-bg:transparent;--list-border:#e4e4e7;--list-fire-bg:rgba(220,30,30,.05);--status-bg:linear-gradient(90deg,rgba(220,80,40,.04),transparent);--body-bg:#ffffff;--radar-bg:#f0f2f4;--radar-rim:rgba(30,130,70,0.22);--radar-tick:rgba(30,130,70,0.20);--thead-bg:rgba(255,255,255,.94);}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}body{color:var(--txt);font:14px/1.45 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;background:var(--body-bg);user-select:none;-webkit-user-select:none}#status{flex-shrink:0;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line);border-left:3px solid var(--orange);background:var(--status-bg);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;line-height:1.3}#status .clear{color:var(--green)}#status .alert{color:var(--red);font-weight:bold}#ver{flex-shrink:0;color:var(--dim);font-size:11px;border:1px solid var(--line);padding:1px 7px;border-radius:4px;white-space:nowrap}#risk{flex-shrink:0;padding:4px 12px;font-size:13px}.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12px}.pill.alert{color:var(--red);border:1px solid var(--red);background:rgba(255,65,65,.08)}.pill.warn{color:var(--yellow);border:1px solid var(--yellow);background:rgba(255,210,63,.07)}.pill.watch{color:var(--cyan);border:1px solid var(--cyan);background:rgba(47,217,200,.06)}.pill.clear{color:var(--green);border:1px solid var(--green);background:rgba(46,224,110,.06)}#radarwrap{flex-shrink:0;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:12px;padding:8px 6px;border-bottom:1px solid var(--line)}#lbtn,#rbtn{display:flex;flex-direction:column;gap:6px;flex-shrink:0}#lbtn button,#rbtn button{width:48px;height:48px;min-width:44px;min-height:44px;background:var(--btn-bg);color:var(--txt);border:1px solid var(--btn-border);border-radius:12px;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:system-ui,-apple-system,sans-serif;padding:0}#lbtn button:active,#rbtn button:active{background:var(--btn-active);transform:scale(0.95)}#lbtn button .g{font-size:15px;line-height:1}#rbtn button .g{font-size:20px;line-height:1}#lbtn button .lb,#rbtn button .lb{font-size:9px;color:var(--dim)}#lbtn button.busy,#rbtn button.busy,#rbtn button.on,#lbtn button.on{background:#2c3530;border-color:var(--green)}#radarc{display:flex;flex-direction:column;align-items:center}#radar{display:block;touch-action:manipulation;cursor:pointer}#radarlabel{color:var(--dim);font-size:11px;padding-top:2px;text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#attrib{font-size:9px;color:#4a4a52;margin-top:2px}#attrib a{color:#4a4a52;text-decoration:none}@media (max-width:640px),(max-device-width:640px){#status{padding:10px 14px;font-size:14px}#risk{padding:5px 14px;font-size:13px}#radarwrap{gap:8px;padding:4px 4px}#lbtn,#rbtn{gap:8px}#lbtn button,#rbtn button{width:48px;height:48px;border-radius:14px}#lbtn button .g{font-size:16px}#rbtn button .g{font-size:20px}#lbtn button .lb,#rbtn button .lb{font-size:9px}#radarlabel{font-size:11px;padding-top:4px;max-width:82vw}#settings.show{display:flex!important;flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px;max-height:55vh;overflow-y:auto}#settings label{font-size:11px}#settings select,#settings input{width:100%!important;padding:12px 12px;font:16px system-ui,-apple-system,sans-serif;border-radius:10px}#settings button{min-height:48px;padding:12px 16px;font:16px system-ui,-apple-system,sans-serif;border-radius:10px}#settings #gps{width:100%!important}#list{padding:2px 4px 12px}#list th{padding:8px 6px;font-size:10px}#list td{padding:12px 6px;font-size:15px}#list td.near{max-width:22vw}#list td.dir{display:none}#list .col-time,#list .col-conf,#list .col-sat,#list .col-frp,#list .col-bright,#list .col-dn{display:none}#foot{padding:8px 10px calc(8px + env(safe-area-inset-bottom));font-size:12px;gap:4px}#foot a{padding:8px 10px;min-width:48px;min-height:48px}#attrib{font-size:8px}}#settings{flex-shrink:0;padding:8px 12px;border-bottom:1px solid var(--line);display:none;gap:8px;align-items:center;flex-wrap:wrap}#settings.show{display:flex}#settings label{color:var(--dim);font-size:12px}#settings select,#settings input{background:var(--input-bg);color:var(--txt);border:1px solid var(--input-border);padding:10px 10px;font:16px system-ui,-apple-system,sans-serif;border-radius:8px}#settings input#lat,#settings input#lon{width:90px}#settings input#zip{width:110px}#settings input#country{width:80px}#settings button{background:var(--btn-bg);color:var(--txt);border:1px solid var(--btn-border);padding:10px 14px;font:14px system-ui,-apple-system,sans-serif;cursor:pointer;border-radius:8px;touch-action:manipulation;min-height:44px}#settings button:active{background:var(--btn-active);transform:scale(0.97)}#settings button.on{background:#2c3530;border-color:var(--green);color:var(--green)}#list{flex:1;overflow-y:auto;padding:4px 4px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}#list::-webkit-scrollbar{width:3px}#list::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px;opacity:0.3}#list table{width:100%;border-collapse:collapse}#list th,#list td{padding:10px 6px;text-align:left;white-space:nowrap}#list thead th{position:sticky;top:0;z-index:2;color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--thead-bg)}#list td{border-bottom:1px solid var(--list-border);font-size:15px}#list td.dist{text-align:right;font-variant-numeric:tabular-nums}#list td.near{max-width:32vw;overflow:hidden;text-overflow:ellipsis}#list td.dot{width:16px;padding:0 3px}.sev{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3a3a40}.sev.warn{background:var(--yellow)}.sev.alert{background:var(--red);box-shadow:0 0 6px var(--red)}.sev.watch{background:var(--cyan)}#list tr.fire td{cursor:pointer}#list tr.fire:active td{background:var(--btn-bg)}#list tr.fire.alert td{color:#ffb3b3}#list tr.fire.alert{background:var(--list-fire-bg)}#list tr.fire.warn td{color:var(--yellow)}#list tr.detail td{border-bottom:1px solid var(--line);color:var(--dim);font-size:13px;padding:6px 6px 6px 16px}#list .col-time,#list .col-conf,#list .col-sat,#list .col-frp,#list .col-bright,#list .col-dn{display:table-cell}#foot{flex-shrink:0;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--dim);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}#foot a{color:var(--dim);text-decoration:none;padding:8px 10px;touch-action:manipulation;border-radius:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}#foot a:active{background:var(--btn-bg)}#themebtn{font-size:20px;opacity:0.8}#themebtn:hover{opacity:1}#spark{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;animation:pulse 2s ease-in-out infinite;vertical-align:1px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}</style>
</head>
<body>
<div id="status"><span id="statustxt"></span><span id="ver"></span></div>
<div id="risk"></div>
<div id="radarwrap">
  <div id="lbtn"></div>
  <div id="radarc">
    <canvas id="radar"></canvas>
    <div id="radarlabel"></div>
    <div id="attrib"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OSM · CARTO</a></div>
  </div>
  <div id="rbtn"></div>
</div>
<div id="list"></div>
<div id="foot">
  <span id="clock"></span>
  <span id="spark"></span>
  <a href="#" id="themebtn" style="font-size:16px">☀</a>
  <a href="#" id="toggle">⚙</a>
</div>
<div id="settings"></div>
<script>var API = 'https://script.google.com/macros/s/AKfycbwiA5CmmxSGT02wvNUjYQXeAeMhh70tUHv0EUV9eHiuJqnX0VuzaHiCjv8Y1nRXdbV7mw/exec';
var S = document.getElementById('statustxt');
var VER = 26;
document.getElementById('ver').textContent = 'v' + VER;
var R = document.getElementById('risk');
var P = document.getElementById('settings');
var L = document.getElementById('list');
var C = document.getElementById('clock');
var T = document.getElementById('toggle');
var radar = document.getElementById('radar');
var rctx = radar.getContext('2d');
var radarlabel = document.getElementById('radarlabel');
var spark = document.getElementById('spark');
var presets = ['athens','thessaloniki','patras','heraklion','rhodes','korinthos'];
var PCOORDS = { athens: [37.9838, 23.7275], thessaloniki: [40.6401, 22.9444],
patras: [38.2466, 21.7346], heraklion: [35.3387, 25.1442],
rhodes: [36.4349, 28.2176], korinthos: [37.9380, 22.9326] };
var srcs = [['viirs','VIIRS'],['noaa20','N20'],['noaa21','N21'],['modis','MODIS'],['all','ALL']];
var memStore = {};
var lsOk = (function() { try { localStorage.setItem('__fw_t', '1'); localStorage.removeItem('__fw_t'); return true; } catch (_) { return false; } })();
function sGet(k) { try { return lsOk ? localStorage.getItem(k) : memStore[k]; } catch (_) { return memStore[k]; } }
function sSet(k, v) { memStore[k] = v; try { if (lsOk) localStorage.setItem(k, v); } catch (_) {} }
var state = {};
try { state = JSON.parse(sGet('fw') || '{}'); } catch (_) {}
if (!state.area) state.area = 'athens';
if (!state.radius) state.radius = 60;
if (!state.src) state.src = 'viirs';
if (!state.country) state.country = 'Greece';
if (!state.expert) state.expert = 0;
var lastData = null;
var lastFires = [];
var hist = []; try { hist = JSON.parse(sGet('fwHist') || '[]'); } catch (_) {}
var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var theme = sGet('fwTheme') || 'light';
var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
var DPR = window.devicePixelRatio || 1;
var DEV_W = IS_IOS ? screen.width : screen.width / DPR;
var DEV_H = IS_IOS ? screen.height : screen.height / DPR;
var isMobile = window.innerWidth <= 640 || DEV_W <= 640;
var TILE_DARK = 'https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png';
var TILE_LIGHT = 'https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png';
var TILE = theme === 'light' ? TILE_LIGHT : TILE_DARK;
var TILE_FB = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
function setTheme(t) {
theme = t;
sSet('fwTheme', t);
document.documentElement.setAttribute('data-theme', t);
document.documentElement.style.colorScheme = t;
document.getElementById('themecolor').setAttribute('content', t === 'light' ? '#ffffff' : '#0d0d0f');
TILE = t === 'light' ? TILE_LIGHT : TILE_DARK;
tileCache = {}; tileKey = ''; tileDirty = true;
var btn = document.getElementById('themebtn');
if (btn) btn.textContent = t === 'light' ? '☀' : '☾';
if (lastData) drawRadar();
}
function toggleTheme() { setTheme(theme === 'dark' ? 'light' : 'dark'); }
setTheme(theme);
function save() { sSet('fw', JSON.stringify(state)); }
function pushHist(n) {
hist.push([Date.now(), n]);
if (hist.length > 60) hist = hist.slice(-60);
sSet('fwHist', JSON.stringify(hist));
drawSpark();
}
function drawSpark() {
if (hist.length < 2) { spark.textContent = ''; return; }
var bars = '\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588';
var counts = hist.map(function(h) { return h[1]; });
var mn = Math.min.apply(null, counts), mx = Math.max.apply(null, counts);
spark.textContent = counts.slice(-18).map(function(v) {
return mn === mx ? bars[0] : bars[Math.min(7, Math.floor((v - mn) / (mx - mn) * 7))];
}).join('');
}
function buildSettings() {
var h = '';
h += '<label>area</label> <select id="area">';
presets.forEach(function(a) {
h += '<option value="' + a + '"' + (a === state.area ? ' selected' : '') + '>' + a + '</option>';
});
h += '</select>';
h += '<label>r</label> <input id="radius" type="number" min="5" max="2000" value="' + state.radius + '" size="3">';
h += '<label>src</label> <select id="src">';
srcs.forEach(function(s) {
h += '<option value="' + s[0] + '"' + (s[0] === state.src ? ' selected' : '') + '>' + s[1] + '</option>';
});
h += '</select>';
h += '<button id="expert">expert: ' + (state.expert ? 'on' : 'off') + '</button>';
h += '<input id="zip" placeholder="postal code">';
h += '<input id="country" value="' + state.country + '">';
h += '<button id="locate">locate</button>';
h += '<label>lat</label> <input id="lat" type="number" step="any">';
h += '<label>lon</label> <input id="lon" type="number" step="any">';
h += '<button id="set">set</button>';
h += '<button id="gps">📍 gps</button>';
P.innerHTML = h;
document.getElementById('area').onchange = function() {
state.area = this.value;
delete state.lat; delete state.lon; delete state.custom;
delete state.gps; delete state.glat; delete state.glon;
save(); load();
};
document.getElementById('radius').onchange = function() {
var v = parseInt(this.value) || 60;
state.radius = Math.min(2000, Math.max(5, v));
this.value = state.radius;
save(); load();
};
document.getElementById('src').onchange = function() {
state.src = this.value;
save(); load();
};
document.getElementById('expert').onclick = function() {
state.expert = state.expert ? 0 : 1;
this.textContent = 'expert: ' + (state.expert ? 'on' : 'off');
this.classList.toggle('on', !!state.expert);
save(); load();
};
document.getElementById('locate').onclick = function() {
var z = document.getElementById('zip').value.trim();
var c = document.getElementById('country').value.trim() || 'Greece';
if (!z) return;
state.country = c;
var btn = this;
btn.textContent = '…';
fetch(API + '?v=zip&zip=' + encodeURIComponent(z) + '&country=' + encodeURIComponent(c))
.then(function(r) { return r.json(); }).then(function(d) {
btn.textContent = 'locate';
if (d.error) { S.innerHTML = '<span class="alert">⚠ ' + d.error + '</span>'; return; }
state.area = d.name; state.lat = d.lat; state.lon = d.lon; state.custom = 1;
delete state.gps; delete state.glat; delete state.glon;
save(); load();
});
};
document.getElementById('set').onclick = function() {
var la = parseFloat(document.getElementById('lat').value);
var lo = parseFloat(document.getElementById('lon').value);
if (isNaN(la) || isNaN(lo) || la < -90 || la > 90 || lo < -180 || lo > 180) {
S.innerHTML = '<span class="alert">⚠ invalid coordinates</span>';
return;
}
state.area = 'custom'; state.lat = la; state.lon = lo; state.custom = 1;
delete state.gps; delete state.glat; delete state.glon;
save(); load();
};
document.getElementById('gps').onclick = gpsGo;
}
function gpsGo() {
if (!navigator.geolocation) {
S.innerHTML = '<span class="alert">⚠ gps unavailable</span>';
return;
}
var btns = document.querySelectorAll('#gps, .gpsbtn');
var busy = function(on) {
for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('busy', on);
};
busy(true);
navigator.geolocation.getCurrentPosition(function(pos) {
state.gps = 1;
state.glat = pos.coords.latitude;
state.glon = pos.coords.longitude;
delete state.lat; delete state.lon; delete state.custom;
save(); syncControls(); busy(false);
// center radar + map on the fix immediately, refine fires in background
if (lastData) renderData({ area: 'gps', lat: state.glat, lon: state.glon,
radius: state.radius, src: state.src, fires: lastFires,
updated: lastData.updated });
load();
}, function() {
busy(false);
delete state.gps; delete state.glat; delete state.glon;
save(); syncControls();
S.innerHTML = '<span class="alert">⚠ location denied</span>';
});
}
var zoomFlash = 0;
function zoomIn() {
state.radius = Math.max(5, Math.round(state.radius / 1.4));
zoomFlash = performance.now();
save(); syncControls();
if (lastData) renderData({ area: lastData.area, lat: lastData.lat, lon: lastData.lon,
radius: state.radius, src: state.src, fires: lastFires,
updated: lastData.updated });
load();
}
function zoomOut() {
state.radius = Math.min(2000, Math.round(state.radius * 1.4));
zoomFlash = performance.now();
save(); syncControls();
if (lastData) renderData({ area: lastData.area, lat: lastData.lat, lon: lastData.lon,
radius: state.radius, src: state.src, fires: lastFires,
updated: lastData.updated });
load();
}
function cycleArea() {
var idx = presets.indexOf(state.area);
state.area = presets[(idx + 1) % presets.length];
delete state.lat; delete state.lon; delete state.custom;
delete state.gps; delete state.glat; delete state.glon;
save(); syncControls();
var c = PCOORDS[state.area];
renderData({ area: state.area, lat: c[0], lon: c[1], radius: state.radius,
src: state.src, fires: [], updated: '' });
load();
}
function cycleSrc() {
var keys = srcs.map(function(s) { return s[0]; });
state.src = keys[(keys.indexOf(state.src) + 1) % keys.length];
save(); syncControls();
if (lastData) renderData({ area: lastData.area, lat: lastData.lat, lon: lastData.lon,
radius: lastData.radius, src: state.src, fires: lastFires,
updated: lastData.updated });
load();
}
function toggleExpert() {
state.expert = state.expert ? 0 : 1;
save(); syncControls();
if (lastData) renderTable();
}
function syncControls() {
var a = document.getElementById('area'), s = document.getElementById('src'),
r = document.getElementById('radius'), e = document.getElementById('expert');
if (a) a.value = state.area;
if (s) s.value = state.src;
if (r) r.value = state.radius;
if (e) { e.textContent = 'expert: ' + (state.expert ? 'on' : 'off'); e.classList.toggle('on', !!state.expert); }
}
function mkBtn(pid, glyph, label, fn, cls) {
var b = document.createElement('button');
b.className = cls || '';
b.innerHTML = '<span class="g">' + glyph + '</span><span class="lb">' + label + '</span>';
b.onclick = fn;
document.getElementById(pid).appendChild(b);
}
function buildToolbar() {
mkBtn('rbtn', '+', 'in', zoomIn);
mkBtn('rbtn', '−', 'out', zoomOut);
mkBtn('rbtn', '📍', 'gps', gpsGo, 'gpsbtn');
mkBtn('lbtn', '⟳', 'refresh', load);
mkBtn('lbtn', 'c', 'area', cycleArea);
mkBtn('lbtn', 's', 'src', cycleSrc);
mkBtn('lbtn', 'd', 'detail', toggleExpert);
syncControls();
}
T.onclick = function(e) {
e.preventDefault();
P.classList.toggle('show');
T.textContent = P.classList.contains('show') ? '✖' : '⚙';
};
document.getElementById('themebtn').onclick = function(e) {
e.preventDefault(); toggleTheme();
};
function compass(deg) {
return ['N','NE','E','SE','S','SW','W','NW'][Math.floor((deg + 22.5) / 45) % 8];
}
function dirLabel(bearing) {
return ['north','northeast','east','southeast','south','southwest','west','northwest'][Math.floor((bearing + 22.5) / 45) % 8];
}
function ageAgo(date, time) {
try {
var m = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
var t = time.match(/^(\d{2})(\d{2})$/);
if (!m || !t) return '?';
var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +t[1], +t[2]));
var min = Math.floor((Date.now() - d.getTime()) / 60000);
if (min < 0) return '?';
if (min < 60) return min + 'm';
if (min < 1440) return Math.floor(min / 60) + 'h';
return Math.floor(min / 1440) + 'd';
} catch(_) { return '?'; }
}
function localTime(date, time) {
try {
var m = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
var t = time.match(/^(\d{2})(\d{2})$/);
if (!m || !t) return time;
var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +t[1], +t[2]));
return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
} catch(_) { return time; }
}
function sizeLabel(f) {
if (f.frp >= 10) return ['LARGE', '#f44'];
if (f.frp >= 2 || f.bright >= 330) return ['medium', '#ea0'];
return ['small', ''];
}
function riskLine(d) {

var xf = (lon + 180) / 360 * n;

tileCanvas.height = th * dpr;
tctx.setTransform(dpr, 0, 0, dpr, 0, 0);

tctx.fillRect(0, 0, tw, th);

img._fb = false;
img.onload = function() { tileDirty = true; };
img.onerror = function() {
if (!this._fb) { this._fb = true; this.src = TILE_FB.replace('{z}', zz).replace('{x}', tx2).replace('{y}', yy); }
else { tileDirty = true; }
};
img.src = TILE.replace('{z}', zz).replace('{x}', tx2).replace('{y}', yy);
tileCache[k2] = img;

})(z, tx, y, (x - x0) * 256, (y - y0) * 256);
